    <script>
        // 預設的 6 個示範影片 ID
        const DEFAULT_VIDEOS = [
            'cUnYPpK7ENk', // 清水坂
            'J3xHBUgWRqc', // 祇園 花見小路
            'MMeBDRfRHyA', // 伏見稻荷大社
            'i2PpmC1IeKk', // 道頓堀
            '5wX3G5oH9L0', // 預備 5
            'xT1037Y61lU'  // 預備 6
        ];

        let videoCount = 6; // <-- 這裡改為 6
        let currentVideos = [];

        // 解析 YouTube 網址或 ID
        function extractVideoId(url) {
            if (!url) return '';
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|live\/)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url.trim();
        }

        // 根據影片總數計算 Grid 欄與列
        function autoCalculateGrid(count) {
            let cols = 2;
            let rows = 2;

            if (count === 1) { cols = 1; rows = 1; }
            else if (count === 2) { cols = 2; rows = 1; }
            else if (count <= 4) { cols = 2; rows = 2; }
            else if (count <= 6) { cols = 3; rows = 2; }
            else if (count <= 9) { cols = 3; rows = 3; }
            else if (count <= 12) { cols = 4; rows = 3; }
            else { cols = 4; rows = 4; }

            const gridContainer = document.getElementById('gridContainer');
            gridContainer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            gridContainer.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
        }

        // 初始化：優先順序 網址參數 -> LocalStorage -> 預設值
        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const vParam = urlParams.get('v');
            const savedVideos = localStorage.getItem('osaka_live_videos');

            if (vParam) {
                // 優先使用 URL 帶入的參數
                const paramIds = vParam.split(',').filter(id => id.trim() !== '');
                if (paramIds.length > 0) {
                    videoCount = paramIds.length;
                    currentVideos = paramIds;
                }
            } else if (savedVideos) {
                // 若 URL 沒有參數，讀取瀏覽器 LocalStorage
                try {
                    const parsed = JSON.parse(savedVideos);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        currentVideos = parsed;
                        videoCount = currentVideos.length;
                    }
                } catch (e) {
                    console.error('無效的 LocalStorage 資料', e);
                }
            }

            // 如果沒有歷史紀錄，自動補滿至 videoCount (6個)
            while (currentVideos.length < videoCount) {
                const nextIdx = currentVideos.length;
                currentVideos.push(DEFAULT_VIDEOS[nextIdx] || '');
            }

            document.getElementById('videoCount').value = videoCount;
            renderDOM();
            saveData();
        }

        // 修改影片數量時呼叫
        function changeCount() {
            const newCount = parseInt(document.getElementById('videoCount').value, 10);
            if (isNaN(newCount) || newCount < 1) return;

            videoCount = newCount;

            if (currentVideos.length < videoCount) {
                while (currentVideos.length < videoCount) {
                    const nextIdx = currentVideos.length;
                    currentVideos.push(DEFAULT_VIDEOS[nextIdx] || '');
                }
            } else if (currentVideos.length > videoCount) {
                currentVideos = currentVideos.slice(0, videoCount);
            }

            renderDOM();
            saveData();
        }

        // 重新繪製介面
        function renderDOM() {
            const controlsContainer = document.getElementById('controlsContainer');
            const gridContainer = document.getElementById('gridContainer');

            controlsContainer.innerHTML = '';
            gridContainer.innerHTML = '';

            autoCalculateGrid(videoCount);

            for (let i = 0; i < videoCount; i++) {
                const videoId = currentVideos[i] || '';
                const fullUrl = videoId ? `https://www.youtube.com/watch?v=${videoId}` : '';

                const inputGroup = document.createElement('div');
                inputGroup.className = 'input-group';
                inputGroup.innerHTML = `
                    <label>視窗 ${i + 1}:</label>
                    <input type="text" id="input${i}" value="${fullUrl}" 
                           onchange="updateVideo(${i}, this.value)" 
                           placeholder="貼上 YouTube 網址或 ID">
                `;
                controlsContainer.appendChild(inputGroup);

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div class="iframe-wrapper" id="player${i}"></div>`;
                gridContainer.appendChild(card);

                renderPlayer(i, videoId);
            }
        }

        // 渲染單個 iframe
        function renderPlayer(index, videoId) {
            const container = document.getElementById(`player${index}`);
            if (!container) return;

            if (!videoId) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = `
                <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1" 
                        allow="autoplay; encrypted-media" allowfullscreen></iframe>
            `;
        }

        // 輸入框變更時呼叫
        function updateVideo(index, value) {
            const videoId = extractVideoId(value);
            currentVideos[index] = videoId;
            renderPlayer(index, videoId);
            saveData();
        }

        // 儲存資料
        function saveData() {
            localStorage.setItem('osaka_live_videos', JSON.stringify(currentVideos));

            const newParams = new URLSearchParams();
            newParams.set('v', currentVideos.join(','));
            const newRelativePathQuery = window.location.pathname + '?' + newParams.toString();
            window.history.replaceState(null, '', newRelativePathQuery);
        }

        // 啟動
        init();
    </script>
